<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Morrow · 登录</title>
<meta name="description" content="Morrow 单用户生活工作台 — Phase 0 登录壳（P0-006）">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<!-- 资源加载失败兜底：仅当 CSS/JS 任一层未生效时可见（app 启动后隐藏）。 -->
<div id="boot-fallback" role="alert">
  <h1>资源加载失败</h1>
  <p>页面脚本或样式未能加载（可能被拦截或文件损坏）。请检查网络后刷新，或改用本地 loopback 方式（如 <code>python3 -m http.server 8080</code> 后访问 <code>http://127.0.0.1:8080</code>）打开同一发行文件。已填写的本地草稿不会因此丢失。</p>
</div>
<main class="shell">
  <header class="topbar">
    <h1>Morrow</h1>
    <div class="version-frame" aria-label="发行标识">
      发行 <span id="release-id">…</span> · <span id="release-sdk">…</span>
    </div>
  </header>

  <div class="sync-row" aria-live="polite">
    <span class="sync-badge" id="sync-badge" data-state="none">未同步</span>
    <span id="sync-detail"></span>
  </div>

  <div id="stale-release-banner" class="stale-release-banner" hidden>
    <span id="stale-release-text"></span>
  </div>

  <div id="panel-host"></div>

  <footer id="storage-line" aria-live="polite"></footer>
</main>
<noscript>
  <div style="max-width:720px;margin:16px auto;padding:16px;border:1px solid #b3261e;border-radius:12px;">
    Morrow 需要启用 JavaScript 才能运行；本页为静态登录壳，不启用脚本时无法登录或同步。
  </div>
</noscript>
<script src="assets/vendor/supabase-js@2.116.0.umd.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/transport.js"></script>
<script src="assets/js/drafts.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
